[project]
name = "talking-exhibits"
version = "0.1.0"
description = "Detecting unanswerable visitor questions in exhibit-grounded QA (IT 3004, IBU)"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "scikit-learn",
    "sentence-transformers",
    "transformers",
    "datasets",
    "torch",
    "matplotlib",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# The package lives in src/, so tests can "import talking_exhibits".
pythonpath = ["src"]
testpaths = ["tests"]
